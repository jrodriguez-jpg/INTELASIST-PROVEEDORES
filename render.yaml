services:
  - type: web
    name: intelasist-proveedores
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VIEWER_ACCESS_CODE
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: APP_ORIGINS
        sync: false
